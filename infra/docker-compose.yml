# Optional: Postgres-backed stack. (Not required: the app defaults to SQLite.)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: civic, POSTGRES_PASSWORD: civic, POSTGRES_DB: civiclens }
    ports: ["5432:5432"]
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["../backend:/app"]
    command: sh -c "pip install -q -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://civic:civic@db:5432/civiclens
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]
